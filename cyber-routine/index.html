<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS PWA 支援 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AntigravityHub" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    
    <meta name="theme-color" content="#0d0a1a" />
    <title>AntigravityHub - 賽博個人儀表板</title>
    <script type="module" crossorigin src="./assets/index-xC3ITtHC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C6ummXA3.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker 註冊成功:', reg.scope))
            .catch(err => console.error('Service Worker 註冊失敗:', err));
        });
      }
    </script>
    <!-- 微縮回航膠囊 (Floating Portal Pill) -->
    <script>
      (function() {
        const s = document.createElement('script');
        s.src = './portal-pill.js';
        s.setAttribute('data-target', '../');
        s.setAttribute('data-label', 'Antigravity Hub');
        s.setAttribute('data-position', 'bottom-right');
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
